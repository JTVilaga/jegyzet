<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4a8f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="ikon/ikon-192.png">
  <link rel="apple-touch-icon" href="ikon/ikon-192.png">
  <title>Jegyzet</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    textarea { width: 100%; height: 200px; }
  </style>
</head>
<body>
  <h1>Gyors jegyzet</h1>
  <textarea id="t" placeholder="Írj ide..."></textarea>
  <p id="allapot"></p>
  <script>
    const t = document.getElementById('t');
    t.value = localStorage.getItem('jegyzet') || '';
    t.addEventListener('input', () => {
      localStorage.setItem('jegyzet', t.value);
      document.getElementById('allapot').textContent = 'Mentve.';
    });
  </script>
  <script src="js/telepites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
